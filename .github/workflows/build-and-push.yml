name: Build and push image

# Builds the Docker image on every push to main (and on manual trigger)
# and pushes it to ghcr.io/aliafsahnoudeh/book_summarizer_ai_agent.
# The HuggingFace Space pulls from there — see DEPLOY.md for the
# one-time HF wiring.

on:
  push:
    branches: [main]
    paths:
      # Only rebuild when something that ends up in the image changes.
      # Test-only changes don't trigger a redeploy.
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "book_builder/**"
      - "book_summarizer/**"
      - "web/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower-case the repo name — ghcr enforces lower-case paths.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
